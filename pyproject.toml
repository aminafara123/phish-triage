[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phish-triage"
version = "0.1.0"
description = "A SOC-style assistant that reads a suspicious email (.eml) and returns a scored verdict: Benign, Suspicious, or Likely Phishing, plus the signal-by-signal reason why."
authors = [{name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]

[project.scripts]
phish-triage = "phish_triage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["phish_triage"]
